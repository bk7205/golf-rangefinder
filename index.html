<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골프 거리측정기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone tool. Status bar, three tabs, big yardage readout, action buttons. */
:root{
  --bg:#f3f6f1; --card:#ffffff; --ink:#10231a; --muted:#5b6b62; --line:#d5ddd5;
  --accent:#14532d; --accent-ink:#ffffff; --flag:#c62828; --ok:#1b7f3b; --warn:#a15c00;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1712; --card:#16221b; --ink:#eaf2ec; --muted:#9bb0a3; --line:#2a3b31;
    --accent:#58c27d; --accent-ink:#06210f; --flag:#ff6b6b; --ok:#58c27d; --warn:#e8a23a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1712; --card:#16221b; --ink:#eaf2ec; --muted:#9bb0a3; --line:#2a3b31;
  --accent:#58c27d; --accent-ink:#06210f; --flag:#ff6b6b; --ok:#58c27d; --warn:#e8a23a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-size:26px;letter-spacing:.02em;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--flag)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 6px;font:inherit;font-weight:500;min-height:44px}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg.small button{min-height:36px;padding:4px 12px;font-size:14px}
button{font-family:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.read{text-align:center;padding:20px 12px}
.big{font-family:var(--display);font-weight:700;font-size:92px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.unit{font-family:var(--display);font-size:28px;color:var(--muted);margin-left:6px}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.btn{width:100%;min-height:54px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:44px;width:auto;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.98)}
.stack{display:flex;flex-direction:column;gap:10px}
select{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 10px;width:100%}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.msg.bad{border-color:var(--flag);color:var(--flag)}
.pin{display:grid;grid-template-columns:52px 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pin:first-child{border-top:0}
.pin .d{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.pin .lbl{font-weight:700}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 4px;border-top:1px solid var(--line);font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:500;border-top:0}
td.n,th.n{text-align:right}
.hole{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hole .num{font-family:var(--display);font-size:40px;font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>골프 거리측정기</h1>
    <div class="seg small" role="tablist" aria-label="단위" id="unitSeg">
      <button role="tab" id="u-m" aria-selected="true" data-unit="m">m</button>
      <button role="tab" id="u-yd" aria-selected="false" data-unit="yd">yd</button>
    </div>
  </div>

  <div class="row" style="flex-wrap:wrap">
    <span class="chip"><span class="dot" id="gpsDot"></span><span id="gpsText">GPS 연결 중</span></span>
    <span class="chip" id="accChip" hidden>오차 ±<b id="accVal">-</b></span>
  </div>
  <div class="msg bad" id="errBox" hidden></div>

  <div class="seg" role="tablist" aria-label="화면" id="tabs">
    <button role="tab" id="t-shot" aria-selected="true" data-tab="shot">샷 거리</button>
    <button role="tab" id="t-green" aria-selected="false" data-tab="green">그린까지</button>
    <button role="tab" id="t-log" aria-selected="false" data-tab="log">기록</button>
  </div>

  <!-- 샷 거리 -->
  <section id="p-shot" class="stack">
    <div class="card read">
      <div><span class="big" id="shotDist">--</span><span class="unit" id="shotUnit">m</span></div>
      <div class="sub" id="shotSub">공 위치를 저장하고 공까지 걸어가세요</div>
    </div>
    <button class="btn" id="markBall">여기를 공 위치로 저장</button>
    <div class="card stack" id="recordBox" hidden>
      <label for="clubSel" style="font-weight:700">사용한 클럽</label>
      <select id="clubSel"></select>
      <button class="btn" id="saveShot">이 거리 기록하기</button>
      <button class="btn ghost" id="cancelShot">공 위치 지우기</button>
    </div>
  </section>

  <!-- 그린까지 -->
  <section id="p-green" class="stack" hidden>
    <div class="card hole">
      <button class="btn small ghost" id="holePrev" aria-label="이전 홀">◀</button>
      <div style="text-align:center"><div class="sub">홀</div><div class="num" id="holeNum">1</div></div>
      <button class="btn small ghost" id="holeNext" aria-label="다음 홀">▶</button>
    </div>
    <div class="card read">
      <div><span class="big" id="greenDist">--</span><span class="unit" id="greenUnit">m</span></div>
      <div class="sub" id="greenSub">그린 중앙까지</div>
    </div>
    <div class="card" id="pinList"></div>
    <div class="msg">그린에 올라가서 앞, 중앙, 뒤 지점에 서서 저장하면 같은 코스에서 다음 라운드에 다시 쓸 수 있습니다.</div>
  </section>

  <!-- 기록 -->
  <section id="p-log" class="stack" hidden>
    <div class="card">
      <table id="clubTable"><thead><tr><th>클럽</th><th class="n">평균</th><th class="n">최대</th><th class="n">횟수</th></tr></thead><tbody></tbody></table>
      <div class="sub" id="emptyLog">아직 기록이 없습니다.</div>
    </div>
    <div class="card"><table id="shotTable"><thead><tr><th>시각</th><th>클럽</th><th class="n">거리</th></tr></thead><tbody></tbody></table></div>
    <button class="btn ghost" id="clearLog" hidden>기록 전체 삭제</button>
  </section>
</main>

<script>
(function(){
  var M_TO_YD = 1.09361;
  var CLUBS = ["드라이버","3번 우드","5번 우드","유틸리티","4번 아이언","5번 아이언","6번 아이언","7번 아이언","8번 아이언","9번 아이언","피칭","52°","56°","60°","퍼터"];
  var $ = function(id){return document.getElementById(id)};

  /* ---------- storage (best effort) ---------- */
  var store = {
    get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  var state = {
    unit: store.get("golf.unit","m"),
    ball: null,                       // {lat,lng}
    shots: store.get("golf.shots",[]),// {club, m, t}
    greens: store.get("golf.greens",{}), // {hole:{front,mid,back}}
    hole: store.get("golf.hole",1),
    pos: null, samples: []
  };

  /* ---------- geo ---------- */
  function haversine(a,b){
    var R=6371008.8, rad=Math.PI/180;
    var dLat=(b.lat-a.lat)*rad, dLng=(b.lng-a.lng)*rad;
    var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
  }
  function currentFix(){
    var now=Date.now();
    var recent=state.samples.filter(function(s){return now-s.t<6000});
    if(!recent.length) return state.pos;
    var w=0,la=0,ln=0;
    recent.forEach(function(s){var k=1/Math.max(s.acc,3);w+=k;la+=s.lat*k;ln+=s.lng*k});
    return {lat:la/w,lng:ln/w,acc:Math.min.apply(null,recent.map(function(s){return s.acc}))};
  }
  function fmt(m){
    if(m==null) return "--";
    var v = state.unit==="yd" ? m*M_TO_YD : m;
    return String(Math.round(v));
  }

  function setStatus(kind,text){
    $("gpsDot").className="dot "+kind; $("gpsText").textContent=text;
  }
  function showErr(t){ var b=$("errBox"); if(t){b.textContent=t;b.hidden=false}else{b.hidden=true} }

  function onPos(p){
    var c=p.coords;
    state.pos={lat:c.latitude,lng:c.longitude,acc:c.accuracy||99,t:Date.now()};
    state.samples.push(state.pos);
    if(state.samples.length>8) state.samples.shift();
    var acc=state.pos.acc;
    $("accChip").hidden=false;
    $("accVal").textContent=Math.round(state.unit==="yd"?acc*M_TO_YD:acc)+state.unit;
    if(acc<=6) setStatus("ok","GPS 양호");
    else if(acc<=15) setStatus("warn","GPS 보통");
    else setStatus("bad","GPS 약함");
    showErr(null);
    render();
  }
  function onErr(e){
    setStatus("bad","GPS 사용 불가");
    var t;
    if(e && e.code===1) t="위치 권한이 막혀 있습니다. 브라우저 주소창의 위치 권한을 허용하고 페이지를 새로고침하세요. 이 페이지가 앱 안의 미리보기라면 링크를 휴대폰 브라우저(Safari, Chrome)에서 직접 여세요.";
    else if(e && e.code===2) t="위치를 확인할 수 없습니다. 휴대폰의 위치 서비스를 켜고 하늘이 트인 곳에서 다시 시도하세요.";
    else if(e && e.code===3) t="위치 응답이 늦습니다. 잠시 후 자동으로 다시 시도합니다.";
    else t="이 환경에서는 위치 기능을 쓸 수 없습니다. 링크를 휴대폰 브라우저에서 직접 여세요.";
    showErr(t);
  }
  function startGps(){
    if(!navigator.geolocation){onErr(null);return}
    try{
      navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
    }catch(e){onErr(null)}
  }

  /* ---------- UI ---------- */
  function setTab(name){
    ["shot","green","log"].forEach(function(t){
      $("p-"+t).hidden = t!==name;
      $("t-"+t).setAttribute("aria-selected", t===name ? "true":"false");
    });
    render();
  }
  function setUnit(u){
    state.unit=u; store.set("golf.unit",u);
    $("u-m").setAttribute("aria-selected",u==="m"?"true":"false");
    $("u-yd").setAttribute("aria-selected",u==="yd"?"true":"false");
    ["shotUnit","greenUnit"].forEach(function(id){$(id).textContent=u});
    if(state.pos) $("accVal").textContent=Math.round(u==="yd"?state.pos.acc*M_TO_YD:state.pos.acc)+u;
    render();
  }

  function render(){
    var fix=currentFix();
    // shot
    if(state.ball && fix){
      var d=haversine(state.ball,fix);
      $("shotDist").textContent=fmt(d);
      $("shotSub").textContent="공 위치에서 걸어온 거리";
      $("markBall").textContent="공 위치 다시 저장";
      $("recordBox").hidden=false;
      state.liveShot=d;
    }else{
      $("shotDist").textContent="--";
      $("shotSub").textContent = fix ? "공 위치를 저장하고 공까지 걸어가세요" : "GPS 신호를 기다리는 중";
      $("markBall").textContent="여기를 공 위치로 저장";
      $("recordBox").hidden=!state.ball;
    }
    $("markBall").disabled=!fix;

    // green
    $("holeNum").textContent=state.hole;
    var g=state.greens[state.hole]||{};
    var rows=[["front","앞"],["mid","중앙"],["back","뒤"]];
    var list=$("pinList"); list.innerHTML="";
    rows.forEach(function(r){
      var pt=g[r[0]];
      var el=document.createElement("div"); el.className="pin";
      var lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=r[1];
      var dist=document.createElement("div"); dist.className="d";
      dist.textContent = (pt&&fix) ? fmt(haversine(fix,pt))+" "+state.unit : (pt?"--":"미저장");
      if(!pt) dist.style.cssText="font-family:var(--body);font-size:15px;font-weight:400;color:var(--muted)";
      var save=document.createElement("button"); save.className="btn small"; save.textContent="저장"; save.disabled=!fix;
      save.onclick=function(){var f=currentFix(); if(!f)return; var gg=state.greens[state.hole]||{}; gg[r[0]]={lat:f.lat,lng:f.lng}; state.greens[state.hole]=gg; store.set("golf.greens",state.greens); render()};
      var del=document.createElement("button"); del.className="btn small ghost"; del.textContent="삭제"; del.disabled=!pt;
      del.setAttribute("aria-label",r[1]+" 지점 삭제");
      del.onclick=function(){var gg=state.greens[state.hole]; if(gg){delete gg[r[0]]; store.set("golf.greens",state.greens); render()}};
      el.appendChild(lbl);el.appendChild(dist);el.appendChild(save);el.appendChild(del);
      list.appendChild(el);
    });
    if(g.mid && fix){ $("greenDist").textContent=fmt(haversine(fix,g.mid)); $("greenSub").textContent="그린 중앙까지"; }
    else if(g.front && fix){ $("greenDist").textContent=fmt(haversine(fix,g.front)); $("greenSub").textContent="그린 앞까지"; }
    else { $("greenDist").textContent="--"; $("greenSub").textContent="이 홀의 그린 지점이 없습니다"; }

    renderLog();
  }

  function renderLog(){
    var by={};
    state.shots.forEach(function(s){(by[s.club]=by[s.club]||[]).push(s.m)});
    var tb=$("clubTable").querySelector("tbody"); tb.innerHTML="";
    var order=CLUBS.filter(function(c){return by[c]});
    order.forEach(function(c){
      var a=by[c], avg=a.reduce(function(x,y){return x+y},0)/a.length, mx=Math.max.apply(null,a);
      var tr=document.createElement("tr");
      [c,fmt(avg),fmt(mx),String(a.length)].forEach(function(v,i){var td=document.createElement("td"); if(i>0)td.className="n"; td.textContent=v; tr.appendChild(td)});
      tb.appendChild(tr);
    });
    $("emptyLog").hidden = state.shots.length>0;
    $("clubTable").hidden = state.shots.length===0;
    var st=$("shotTable").querySelector("tbody"); st.innerHTML="";
    state.shots.slice().reverse().slice(0,30).forEach(function(s){
      var d=new Date(s.t), tr=document.createElement("tr");
      var time=(d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
      [time,s.club,fmt(s.m)+" "+state.unit].forEach(function(v,i){var td=document.createElement("td"); if(i===2)td.className="n"; td.textContent=v; tr.appendChild(td)});
      st.appendChild(tr);
    });
    $("shotTable").hidden=state.shots.length===0;
    $("clearLog").hidden=state.shots.length===0;
  }

  /* ---------- events ---------- */
  $("tabs").addEventListener("click",function(e){var t=e.target.closest("[data-tab]"); if(t) setTab(t.dataset.tab)});
  $("unitSeg").addEventListener("click",function(e){var t=e.target.closest("[data-unit]"); if(t) setUnit(t.dataset.unit)});
  $("markBall").onclick=function(){var f=currentFix(); if(!f)return; state.ball={lat:f.lat,lng:f.lng}; render()};
  $("cancelShot").onclick=function(){state.ball=null; render()};
  $("saveShot").onclick=function(){
    var f=currentFix(); if(!state.ball||!f) return;
    var m=haversine(state.ball,f);
    state.shots.push({club:$("clubSel").value,m:m,t:Date.now()});
    store.set("golf.shots",state.shots);
    state.ball=null; render();
  };
  $("holePrev").onclick=function(){state.hole=state.hole<=1?18:state.hole-1; store.set("golf.hole",state.hole); render()};
  $("holeNext").onclick=function(){state.hole=state.hole>=18?1:state.hole+1; store.set("golf.hole",state.hole); render()};
  var armed=false, armTimer=null;
  $("clearLog").onclick=function(){
    var b=$("clearLog");
    if(!armed){armed=true; b.textContent="한 번 더 누르면 삭제됩니다"; armTimer=setTimeout(function(){armed=false;b.textContent="기록 전체 삭제"},3000); return}
    clearTimeout(armTimer); armed=false; b.textContent="기록 전체 삭제";
    state.shots=[]; store.set("golf.shots",[]); render();
  };

  /* ---------- init ---------- */
  var sel=$("clubSel");
  CLUBS.forEach(function(c){var o=document.createElement("option"); o.textContent=c; o.value=c; sel.appendChild(o)});
  sel.value="7번 아이언";
  if(state.hole<1||state.hole>18) state.hole=1;
  setUnit(state.unit);
  setStatus("", "GPS 연결 중");
  startGps();
  setInterval(render,1000);
})();
</script>
</body>
</html>
